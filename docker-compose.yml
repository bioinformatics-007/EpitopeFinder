version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CLBTOPE_DB=/app/tools/clbtope/clbtope/Database
    volumes:
      - ./Results:/app/Results
      - ./jobs:/app/jobs
      - ./uploads:/app/uploads
      - ./tools:/app/tools
      - ./model_sav:/app/model_sav
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CLBTOPE_DB=/app/tools/clbtope/clbtope/Database
    volumes:
      - ./Results:/app/Results
      - ./jobs:/app/jobs
      - ./uploads:/app/uploads
      - ./tools:/app/tools
      - ./model_sav:/app/model_sav
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
