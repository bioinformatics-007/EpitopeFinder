# ==============================================================================
# EpitopeFinder — Production Nginx Configuration Template
# ==============================================================================
# This template configures Nginx as a secure reverse proxy terminating SSL/TLS.
# Next.js frontend is assumed to run on port 3000/3001.
# FastAPI backend is assumed to run on port 8000.
#
# Copy this file to your Nginx configuration directory (e.g., /etc/nginx/sites-available/epitopefinder)
# and adjust the domain name, SSL paths, and upstream ports accordingly.
# ==============================================================================

# Define upstreams for frontend and backend services
upstream frontend_server {
    server 127.0.0.1:3000; # Address of the compiled Next.js node runner
}

upstream backend_server {
    server 127.0.0.1:8000; # Address of the FastAPI uvicorn runner
}

# ── 1. Redirect HTTP (Port 80) to HTTPS (Port 443) ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name epitopefinder.yourdomain.com; # Replace with your actual domain

    return 301 https://$host$request_uri;
}

# ── 2. HTTPS Server Block (Port 443) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name epitopefinder.yourdomain.com; # Replace with your actual domain

    # SSL Certificate Paths (Adjust to your Certbot/LetsEncrypt paths)
    ssl_certificate /etc/letsencrypt/live/epitopefinder.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epitopefinder.yourdomain.com/privkey.pem;

    # SSL Security Standards (Modern & secure parameters)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Allow large FASTA uploads (up to 50MB)
    client_max_body_size 50M;

    # ── API endpoints routing (FastAPI backend) ───────────────────────────────
    location /api/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Documentation routing
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js Frontend routing ──────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
